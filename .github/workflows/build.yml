name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest --stacktrace

      # Android's static checks across the whole app, both editions. Any lint error fails the build.
      - name: Lint
        run: ./gradlew lintGithubDebug lintPlayDebug

      - name: Print lint findings
        if: always()
        run: |
          for f in $(find app/build -iname 'lint-results-*debug.txt'); do
            echo "== $f"
            grep -E ': (Error|Warning):' "$f" | sed 's#.*/app/src/#app/src/#' || true
          done

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*

      - name: Assemble debug APKs (both editions)
        run: ./gradlew assembleDebug --stacktrace

      # The Play edition's store build (shrunk with R8, as uploaded to Play Console), so a problem
      # in it shows up here rather than on release day. Signed with the debug key in this job.
      - name: Build the Play bundle
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opentv-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
