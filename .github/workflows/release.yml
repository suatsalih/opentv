name: Release

on:
  push:
    tags: ['v*']
  # A tag created from the website's "Draft a new release" page does not fire a push event,
  # so a published release starts the build too. The workflow then fills in its release notes.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Play bundle and publish release notes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest

      # Only runs if a keystore has been added to repository secrets. Without one the
      # release build falls back to the debug key, which Play Console rejects — see
      # docs/RELEASING.md.
      # The secrets context is not usable directly in an `if:`, so it is lifted into env first.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # The Google Play edition as an app bundle, signed with the upload key, ready for Play Console.
      # OpenTV is distributed through Google Play only: no APK is built or published here. The
      # repository offers the source code, which GitHub attaches to every release automatically.
      - name: Assemble Play bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease

      # The bundle is for uploading to Play Console by hand, not a public download: it is kept as a
      # short-lived workflow artifact and never attached to the release.
      - name: Keep the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: opentv-play-${{ github.ref_name }}
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ ("^## " v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See the changelog for what is new in this release." > release-notes.md; fi
          {
            echo ""
            echo "---"
            echo "Source code only. OpenTV is available on Google Play: https://play.google.com/store/apps/details?id=io.github.suatsalih.opentv"
          } >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release-notes.md
